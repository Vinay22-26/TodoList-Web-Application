<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <mat-icon class="auth-card__brand-icon">checklist</mat-icon>
      <span>TaskFlow</span>
    </div>

    <h1>Welcome back</h1>
    <p class="auth-card__subtitle">Log in to see your todos.</p>

    <div class="auth-card__error" role="alert" *ngIf="error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="auth-field">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          [attr.aria-invalid]="username?.invalid && username?.touched" />
        <div class="auth-field__error" role="alert" *ngIf="username?.invalid && username?.touched">
          Username is required.
        </div>
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="password?.invalid && password?.touched" />
        <div class="auth-field__error" role="alert" *ngIf="password?.invalid && password?.touched">
          Password is required.
        </div>
      </div>

      <button type="submit" class="btn btn--primary" [disabled]="submitting">
        <mat-icon *ngIf="submitting" class="spin">autorenew</mat-icon>
        <span>{{ submitting ? 'Logging in...' : 'Log In' }}</span>
      </button>
    </form>

<!--    <p class="auth-card__footer">-->
<!--      Don't have an account? <a routerLink="/register">Create one</a>-->
<!--    </p>-->
  </div>
</div>
